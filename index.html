<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="An infinite procedurally generated voxel sandbox that runs entirely in the browser.">
  <title>Voxel — an infinite block sandbox</title>
  <link rel="stylesheet" href="./src/ui/styles/base.css">
  <link rel="stylesheet" href="./src/ui/styles/ui.css">
  <link rel="stylesheet" href="./src/ui/styles/mobile.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23558b3f'/><rect y='4' width='16' height='12' fill='%237a5230'/></svg>">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Boot and world-loading screen. Reused for every long operation. -->
  <div id="boot" class="boot">
    <canvas class="boot__canvas" id="boot-canvas"></canvas>
    <div class="boot__inner">
      <!-- An isometric grass block. Drawn as polygons rather than assembled
           from skewed CSS faces because the shape is then unambiguous, and
           animated by transform so it keeps moving on the compositor while the
           main thread is inside terrain generation. -->
      <svg class="cube" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="50,14 86,32 50,50 14,32" fill="#7fbb4d"/>
        <polygon points="14,32 50,50 50,86 14,68" fill="#6d4f31"/>
        <polygon points="86,32 50,50 50,86 86,68" fill="#8a6540"/>
        <polygon points="14,32 50,50 50,59 14,41" fill="#5f8f3a"/>
        <polygon points="86,32 50,50 50,59 86,41" fill="#74a944"/>
      </svg>
      <h1 class="boot__logo" id="boot-title">VOXEL</h1>
      <p class="boot__subtitle" id="boot-subtitle">An infinite block world</p>

      <ol class="boot__stages" id="boot-stages"></ol>

      <div class="boot__bar"><div class="boot__fill" id="boot-fill"></div></div>
      <div class="boot__meta">
        <span class="boot__status" id="boot-status">Starting up</span>
        <span class="boot__percent" id="boot-percent">0%</span>
      </div>

      <p class="boot__tip" id="boot-tip"></p>
    </div>
  </div>

  <!-- Every menu screen renders into here. -->
  <div id="menu" class="menu hidden"></div>

  <!-- Built by ui/hud.js: crosshair, hotbar, vitals, toasts, overlays. -->
  <div id="hud" class="hud hidden"></div>

  <!-- Inventory / creative block palette. -->
  <div id="inventory" class="modal hidden"></div>

  <!-- Chat log and command console. -->
  <div id="chat" class="chat"></div>

  <!-- On-screen controls, built by ui/touch-controls.js when mobile mode is on. -->
  <div id="touch" class="touch hidden"></div>

  <noscript>
    <div class="noscript">
      <h1>JavaScript required</h1>
      <p>This game renders its world with WebGL 2 and needs JavaScript enabled to run.</p>
    </div>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
